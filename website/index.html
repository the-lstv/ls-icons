<head>
    @use(ls:5.2.9[flat, color, modal, animation], google-fonts[Poppins]);
    @use("~/iconfont/style.css");
    @page font: "Poppins", sans-serif;
</head>

<body ls ls-accent="blue" ls-style="flat" ls-theme="dark" .level-0>

    <header .level-1>
        <input type="text" placeholder="Search icons..." id="searchInput">
    </header>

    <main>

    </main>

    <template #iconIndex>
        @importRaw ('~/index.json');
    </template>

    <style>
        body {
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
        }

        body, html, :root {
            overflow: hidden !important;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            padding: 16px;
            height: 100%;
        }

        header {
            padding: 16px;
            display: flex;
            gap: 16px;
            flex-direction: column;
            min-width: 0;

            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15), inset 0 -1px 0 rgba(255, 255, 255, 0.15);

            input {
                flex: 1;
                padding: 8px 12px;
                font-size: 14px;
            }
        }

        .icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px;
            cursor: pointer;
        }

        .icon i {
            font-size: 24px;
            min-height: 32px;
        }

        .icon span {
            margin-top: 8px;
            font-size: 12px;
            text-align: center;
        }

        .icon-container {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .preview-container {
            display: flex;
            justify-content: center;
        }

        .preview {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: var(--base-20);
        }

        [ls-theme="light"].preview.preview {
            color: var(--base-80);
        }
    </style>

    <script>
        const container = document.querySelector('#iconIndex');
        const iconIndex = container? JSON.parse(container.content.childNodes[0].textContent || '[]') : [];

        const iconFuzz = iconIndex.map(icon => [icon.name, LS.Util.normalize(icon.name + (icon.aliases || []).join(' ') + ' ' + (icon.keywords || []).join(' ') + ' ' + (icon.categories || []).join(' '))]);

        const styles = ['regular', 'bold', 'fill', 'sharp', 'sharp-fill', 'duotone'];
        let style = 'regular';

        if(!LS.SelectOne) LS.SelectOne = LS.Tiny.O; // Fallback for older LS versions

        LS.SelectOne("header").append(LS.Create({
            tag: "ls-group",
            class: "style-buttons",
            inner: styles.map(style => ({
                tag: "button",
                text: style,

                class: style === style ? '' : 'elevated',

                onclick() {
                    style = style;
                    document.querySelectorAll('.icon i').forEach(i => {
                        const name = i.parentElement.dataset.name;
                        i.className = `ls-icon li-${name}-${style}`;
                    });

                    document.querySelectorAll('button').forEach(b => b.classList.add('elevated'));
                    this.classList.remove('elevated');
                }
            }))
        }))

        const iconContainer = LS.Create('div', { class: 'icon-container' }).addTo(LS.SelectOne('main'));
        for (const icon of iconIndex) {
            const iconElement = LS.Create('div', { class: 'icon', inner: [
                LS.Create('i', { class: `ls-icon li-${icon.name}-${style}` }),
                LS.Create('span', { text: icon.name })
            ], onclick() {
                LS.Modal.buildEphemeral({
                    title: icon.name,
                    content: LS.Create('div', { inner: [
                        {
                            class: "preview-container",
                            inner: [
                                { class: "preview level-2", attributes: { "ls-theme": "dark"  }, accent: "white", inner: LS.Create('i', { class: `ls-icon li-${icon.name}-${style}`, style: 'font-size: 128px;' }) },
                                { class: "preview level-2", attributes: { "ls-theme": "light" }, accent: "white", inner: LS.Create('i', { class: `ls-icon li-${icon.name}-${style}`, style: 'font-size: 128px;' }) },
                            ]
                        },

                        { tag: "br" },
                        { tag: "br" },
                        styles.map(s => LS.Create('i', { class: `ls-icon li-${icon.name}-${s}`, style: 'font-size: 32px; margin-right: 8px;' })),
                        LS.Create('p', { text: `Categories: ${icon.categories.join(', ')}` }),
                        LS.Create('p', { text: `Keywords: ${icon.keywords.join(', ')}` }),
                        LS.Create('p', { text: `Aliases: ${icon.aliases.join(', ')}` }),
                    ]})
                });
            }});

            iconElement.dataset.name = icon.name;

            iconContainer.appendChild(iconElement);
        }

        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', () => {
            const query = LS.Util.normalize(searchInput.value);

            if(!query) {
                document.querySelectorAll('.icon').forEach(icon => icon.style.display = 'flex');
                return;
            }

            for(const [name, data] of iconFuzz) {
                const iconElement = document.querySelector(`.icon[data-name="${name}"]`);
                if (data.includes(query)) {
                    iconElement.style.display = 'flex';
                } else {
                    iconElement.style.display = 'none';
                }
            }
        });
    </script>
</body>
